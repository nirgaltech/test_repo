    <script>
        class BankAccount{
            // encapsulation
            #balance;
            constructor(accountHolder, initialBalance=0){
                this.accountHolder = accountHolder;
                this.#balance = initialBalance;
            }

            deposit(amount){ // הפקדה לחשבון
                if(amount >= 0)
                    this.#balance += amount;
                else
                    console.log("Cannot deposit negative amount!");

                return this.#balance;
            }

            withdraw(amount){ // משיכה מהחשבון
                if(amount >= 0 && this.#balance >= amount)
                    this.#balance -= amount;
                else
                    console.log("No overdraft for you, go work!!");
            }

            getBalance(){
                this.#stam();
                return this.#balance;
            }

            #stam(){
                console.log("this is stam");
            }
        }

        const acc1 = new BankAccount('Nir Gal', 0);
        acc1.deposit(1000);
        //acc1.#balance = 10;
        console.log(acc1.getBalance());
        

        
    </script>
